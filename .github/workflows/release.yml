name: Release

# A tag v* builds firmware and retained Windows/Linux desktop apps.
# Running by hand produces workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            file: pokeldn-radio.bin
          - target: esp32s3
            file: pokeldn-radio-s3.bin
          - target: esp32c3
            file: pokeldn-radio-c3.bin
          - target: esp32c6
            file: pokeldn-radio-c6.bin
          # Retain Bluetooth firmware and transport support.
          - target: esp32c6
            file: pokeldn-radio-ble-c6.bin
            ble: true
          - target: esp32
            file: pokeldn-radio-ble.bin
            ble: true
    steps:
      - uses: actions/checkout@v7
      - name: Build and merge the image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp32
          if [ "${{ matrix.ble }}" = "true" ]; then
            export POKELDN_BLE=1
            set -- -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ble"
          fi
          idf.py "$@" set-target ${{ matrix.target }}
          idf.py "$@" build
          idf.py "$@" merge-bin -o "$GITHUB_WORKSPACE/${{ matrix.file }}"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}${{ matrix.ble && '-ble' || '' }}
          path: ${{ matrix.file }}

  # The controller firmware (docs/hardware_pad.md): an S3 over USB, a classic ESP32 over Bluetooth.
  pad:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32s3
            file: pokeldn-pad-s3.bin
          - target: esp32
            file: pokeldn-pad.bin
    steps:
      - uses: actions/checkout@v7
      - name: Build and merge the image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/pad
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py merge-bin -o "$GITHUB_WORKSPACE/${{ matrix.file }}"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-pad-${{ matrix.target }}
          path: ${{ matrix.file }}

  app:
    needs: [firmware, pad]
    # actions: SignPath reads the job and its artifact; the unsigned upload is deleted after signing.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pokeldn-windows-x64.zip
          - os: ubuntu-22.04
            asset: pokeldn-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32s3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c6
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-pad-esp32s3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-pad-esp32
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32-ble
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c6-ble
          path: gui/firmware
      - name: Install
        run: python -m pip install -r gui/requirements.txt
      # The wheel's prebuilt run.exe is shared with much PyInstaller malware; Defender's ML flagged 0.31.0.
      - name: Compile PyInstaller's bootloader (Windows)
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $version = python -c "import PyInstaller; print(PyInstaller.__version__)"
          python -m pip install --force-reinstall --no-deps --no-cache-dir --no-binary pyinstaller "pyinstaller==$version"
      # Both builds are pure functions of these inputs; a hit skips Flutter and CMake entirely.
      - name: Restore the Flet client
        id: client
        uses: actions/cache@v6
        with:
          path: |
            gui/client/*
            !gui/client/flet
          key: flet-client-${{ runner.os }}-${{ hashFiles('requirements.txt', 'gui/requirements.txt', 'gui/flet_client.py', 'scripts/build_client.py', 'gui/flet_drop/**') }}
      - name: Restore the ARM-only Unicorn
        id: unicorn
        uses: actions/cache@v6
        with:
          path: |
            gui/unicorn/lib
            gui/unicorn/pokeldn-unicorn
          key: unicorn-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/build_unicorn.py') }}
      # The app runs its own build of Flet's client, which takes files dropped on it (scripts/build_client.py).
      - name: Flutter version
        if: steps.client.outputs.cache-hit != 'true' || runner.os == 'Linux'
        id: flet
        shell: bash
        run: |
          python -m flet_cli.cli --version --json > flet.json
          echo "flutter=$(python -c "import json; print(json.load(open('flet.json'))['flutter'])")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.client.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ steps.flet.outputs.flutter }}
          channel: stable
          cache: true
      # Without recommends: 251 MB with them, fetched at a few kB/s from a slow Azure mirror, held the job for hours.
      - name: Flutter's Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $(python -c "import json; print(' '.join(json.load(open('flet.json'))['linux_dependencies']))")
      - name: Build the Flet client
        if: steps.client.outputs.cache-hit != 'true'
        run: python scripts/build_client.py
      - name: Build the ARM-only Unicorn
        if: steps.unicorn.outputs.cache-hit != 'true'
        run: python scripts/build_unicorn.py
      - name: Pack
        run: python scripts/pack_app.py
      - name: Verify the frozen app (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_app.py dist/pokeldn/pokeldn
      - name: Verify the frozen app (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_app.py dist/pokeldn/pokeldn.exe
      # SignPath Foundation signs pokeldn.exe, the PKHeX helper and Unicorn (.github/signpath/artifact-configuration.xml);
      # a fork without SIGNPATH_API_TOKEN ships unsigned. vars.SIGNPATH_POLICY switches to release-signing.
      - name: Upload for signing (Windows)
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        env:
          SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pokeldn-windows-unsigned
          path: dist/pokeldn
          retention-days: 1
      - name: Sign (Windows)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4b87571e-2d2a-468b-96f7-3b29ba9ff1a5
          project-slug: pokeldn
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: pokeldn-windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Replace with the signed files (Windows)
        if: steps.unsigned.outcome == 'success'
        run: |
          Remove-Item -Recurse -Force dist/pokeldn
          Move-Item signed dist/pokeldn
          python scripts/check_app.py dist/pokeldn/pokeldn.exe
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.unsigned.outputs.artifact-id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/pokeldn -DestinationPath "${{ matrix.asset }}"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  checksums:
    needs: [app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Hash release assets
        working-directory: assets
        run: sha256sum pokeldn-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Check the release notes name this tag
        run: test "$(head -n1 .github/release-notes.md)" = "# pokeldn ${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v3
        with:
          name: pokeldn ${{ github.ref_name }}
          files: assets/*
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
