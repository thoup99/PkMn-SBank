name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            gui/requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install -r requirements-web.txt httpx==0.28.1 -r requirements.txt pytest==9.1.1 pytest-xdist==3.8.0 esptool==5.4.0 "flet[desktop]==1.0.2"
      - run: dotnet build -c Release services/pkhex -warnaserror
      - run: python -m pytest tests/ -q -W error -n auto --dist worksteal

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
